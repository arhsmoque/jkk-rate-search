<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <script>(function(){if(localStorage.getItem('air-selangor-dark')==='1')document.documentElement.classList.add('dark');}());</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#005b96">
  <meta name="description" content="Carian spesifikasi dan garis panduan Air Selangor — SYABAS Standard Specs 2007 & SPAN UTG 2018.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Air Selangor — Spesifikasi &amp; Garis Panduan</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23005b96'/%3E%3Ctext x='50' y='68' font-size='40' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EAS%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="container">

    <div class="sticky-header">
      <header>
        <div class="header-main">
          <div class="header-brand">
            <span class="brand-eyebrow">Air Selangor Specifications</span>
            <h1>Spesifikasi &amp; Garis Panduan</h1>
            <p>SYABAS Standard Specs 2007 &nbsp;·&nbsp; SPAN Uniform Technical Guidelines 2018</p>
          </div>
          <button id="dark-toggle" class="dark-toggle" aria-label="Togol mod gelap">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.75"/>
              <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="search-wrap">
        <svg width="0" height="0" style="position:absolute">
          <defs>
            <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#60a5fa"/>
              <stop offset="100%" stop-color="#005b96"/>
            </linearGradient>
          </defs>
        </svg>
        <input
          id="search-input"
          type="text"
          aria-label="Cari spesifikasi"
          placeholder="Cari e.g. paip, konkrit, valves, HDPE, dewatering…"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >
        <span class="search-icon-wrap" aria-hidden="true">
          <svg class="search-icon-svg" viewBox="0 0 22 22" fill="none">
            <circle cx="9.5" cy="9.5" r="6.5" stroke="url(#sg)" stroke-width="2"/>
            <path d="M14.5 14.5L19 19" stroke="url(#sg)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
      </div>

      <div class="filter-bar">
        <button id="filter-all" class="filter-pill active" data-filter="all">Semua</button>
        <button id="filter-syabas" class="filter-pill" data-filter="syabas">SYABAS 2007</button>
        <button id="filter-span" class="filter-pill" data-filter="span">SPAN UTG 2018</button>
      </div>

      <div id="status-bar" class="status-bar">
        <span class="spinner"></span>
        <span id="status-text">Memuatkan…</span>
      </div>
    </div>

    <ul id="results-list" class="results-list" role="list"></ul>

    <footer class="footer">
      Luar talian &nbsp;·&nbsp; Data: SYABAS 2007 / SPAN UTG 2018 &nbsp;·&nbsp; Tekan <kbd>/</kbd> untuk cari
    </footer>
  </div>

  <script src="vendor/sql-wasm.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(console.error);
    }
  </script>
</body>
</html>
